name: Deploy Cloudflare Worker
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
jobs:
  deploy:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy when Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SCORE_KV_NAMESPACE_ID: ${{ vars.SCORE_KV_NAMESPACE_ID }}
          SCORE_KV_PREVIEW_NAMESPACE_ID: ${{ vars.SCORE_KV_PREVIEW_NAMESPACE_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$SCORE_KV_NAMESPACE_ID" ]; then
            echo "Cloudflare deployment skipped: repository variables/secrets are not configured."
            exit 0
          fi
          PREVIEW_ID="${SCORE_KV_PREVIEW_NAMESPACE_ID:-$SCORE_KV_NAMESPACE_ID}"
          sed -i "s/REPLACE_WITH_KV_NAMESPACE_ID/$SCORE_KV_NAMESPACE_ID/" wrangler.toml
          sed -i "s/REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID/$PREVIEW_ID/" wrangler.toml
          npx wrangler deploy
