name = "score-track"
main = "src/v020.js"
account_id = "f0a06e40a722f0c0f7af4fe8944881e9"
compatibility_date = "2026-09-07"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/api/*", "/share/*", "/p/*", "/join/*", "/recover/*", "/forgot", "/app*", "/" ]

[[kv_namespaces]]
binding = "SCORE_KV"
id = "7341ae0c8a5b43e8a249f5429691b9d0"

[secrets]
required = [ "SESSION_SECRET", "AUTH_PEPPER", "ADMIN_BOOTSTRAP_SECRET" ]

[vars]
APP_VERSION = "0.4.1"
SCHEMA_VERSION = "1"
PASSWORD_ITERATIONS = "20000"
