name = "score-track"
main = "src/index.js"
compatibility_date = "2026-09-07"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/api/*", "/share/*", "/p/*", "/app*", "/" ]

[[kv_namespaces]]
binding = "SCORE_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"

[vars]
APP_VERSION = "0.1.0"
SCHEMA_VERSION = "1"
PASSWORD_ITERATIONS = "20000"
